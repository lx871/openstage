name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20.x', '22.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec tsx tools/compat-check/src/index.ts tests/fixtures/linwan.json
      - run: pnpm exec tsx tools/cli/src/index.ts trace tests/fixtures/linwan.json --turn 1
